name: VGC Wiki Suggestion PR Creator

on:
  repository_dispatch:
    types: [wiki_suggestion]

jobs:
  create_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Suggestion and Increment Version
        id: apply_changes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const payload = context.payload.client_payload;
            const category = payload.category;
            const itemId = payload.itemId;
            let field = payload.fieldToModify;
            const suggestion = payload.suggestion.trim();
            const lang = payload.lang || 'es'; // Idioma desde el que se envió

            // Mapear 'description' al nombre real 'desc' en el JSON
            if (field === 'description') {
              field = 'desc';
            }

            let fileName = '';
            switch(category) {
              case 'Pokemon': fileName = 'FINAL_VGC_POKEDEX.json'; break;
              case 'Moves': fileName = 'FINAL_VGC_MOVES.json'; break;
              case 'Abilities': fileName = 'FINAL_VGC_ABILITIES.json'; break;
              case 'Items': fileName = 'FINAL_VGC_ITEMS.json'; break;
              case 'Natures': fileName = 'FINAL_VGC_NATURES.json'; break;
              case 'Types': fileName = 'FINAL_VGC_TYPES.json'; break;
              case 'Mechanics': fileName = 'FINAL_VGC_MECHANICS.json'; break;
            }

            let changeSummary = 'No se pudo aplicar automáticamente.';
            let applied = false;

            if (fileName && fs.existsSync(fileName)) {
              try {
                const data = JSON.parse(fs.readFileSync(fileName, 'utf8'));
                let foundItem;
                
                if (Array.isArray(data)) {
                  foundItem = data.find(x => String(x.id).toLowerCase() === String(itemId).toLowerCase());
                } else if (data && typeof data === 'object') {
                  foundItem = data[itemId];
                }

                if (foundItem) {
                  const originalValue = foundItem[field];
                  let newValue = suggestion;

                  // 1. Si es un objeto de traducción (ej: desc o name)
                  if (originalValue && typeof originalValue === 'object' && !Array.isArray(originalValue)) {
                    const updatedObj = { ...originalValue };
                    updatedObj[lang] = suggestion; // Actualiza solo 'es' o 'en'
                    newValue = updatedObj;
                  }
                  // 2. Si es un número
                  else if (typeof originalValue === 'number') {
                    const parsedNum = parseFloat(suggestion.replace(/[^\d.-]/g, ''));
                    if (!isNaN(parsedNum)) newValue = parsedNum;
                  } 
                  // 3. Si es un booleano
                  else if (typeof originalValue === 'boolean') {
                    newValue = (suggestion.toLowerCase() === 'true' || suggestion.toLowerCase() === 'champions' || suggestion === '1');
                  }
                  // 4. Si es un arreglo (ej: types)
                  else if (originalValue && Array.isArray(originalValue)) {
                    try {
                      newValue = JSON.parse(suggestion);
                    } catch(e) {
                      newValue = suggestion.split(',').map(s => s.trim());
                    }
                  }

                  foundItem[field] = newValue;
                  fs.writeFileSync(fileName, JSON.stringify(data, null, 2), 'utf8');
                  changeSummary = `Modificado el campo \`${field}\` de \`${JSON.stringify(originalValue)}\` a \`${JSON.stringify(newValue)}\` en \`${fileName}\`.`;
                  applied = true;
                } else {
                  changeSummary = `No se encontró el elemento con ID \`${itemId}\` en \`${fileName}\`.`;
                }
              } catch (e) {
                changeSummary = `Error al modificar JSON: ${e.message}`;
              }
            }

            if (applied && fs.existsSync('version.json')) {
              try {
                const verData = JSON.parse(fs.readFileSync('version.json', 'utf8'));
                const oldVersion = verData.version || 0;
                verData.version = oldVersion + 1;
                fs.writeFileSync('version.json', JSON.stringify(verData, null, 2), 'utf8');
                changeSummary += `\nIncrementada versión de base de datos a \`${verData.version}\` en \`version.json\`.`;
              } catch (e) {
                changeSummary += `\nError al incrementar version.json: ${e.message}`;
              }
            }

            core.setOutput('summary', changeSummary);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "wiki: aplicar cambio propuesto para ${{ github.event.client_payload.itemName }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: wiki-suggestion/${{ github.event.client_payload.itemId }}-${{ github.event.client_payload.fieldToModify }}
          delete-branch: true
          title: "🧪 Sugerencia Wiki: Modificar ${{ github.event.client_payload.itemName }} [${{ github.event.client_payload.fieldToModify }}]"
          body: |
            ### Propuesta de Balance Recibida 🧪
            
            Un usuario ha enviado una propuesta de cambio desde la aplicación.
            
            * **Categoría:** `${{ github.event.client_payload.category }}`
            * **Elemento:** `${{ github.event.client_payload.itemId }}` (${{ github.event.client_payload.itemName }})
            * **Campo a Modificar:** `${{ github.event.client_payload.fieldToModify }}`
            * **Cambios Propuestos (Entrada del usuario):** `${{ github.event.client_payload.suggestion }}`
            * **Fecha de Envío:** `${{ github.event.client_payload.submittedAt }}`
            
            ---
            
            #### ⚙️ Resultado del Autocambio:
            ${{ steps.apply_changes.outputs.summary }}
            
            #### 💡 Motivo Competitivo:
            ```text
            ${{ github.event.client_payload.reason }}
            ```
            
            ---
            _Puedes revisar los archivos cambiados en este Pull Request, hacer correcciones manuales si el parseo no fue perfecto, y luego fusionar (Merge) para desplegar el cambio OTA._
